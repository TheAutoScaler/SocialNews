name: Publish approved X post

on:
  schedule:
    - cron: "0 17 * * 1"
  workflow_dispatch:
    inputs:
      live:
        description: "Actually publish to X"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: x-publishing-queue
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: x-production
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Publish due approved copy
        id: publish
        continue-on-error: true
        env:
          X_USER_ACCESS_TOKEN: ${{ secrets.X_USER_ACCESS_TOKEN }}
          X_CONSUMER_KEY: ${{ secrets.X_CONSUMER_KEY }}
          X_CONSUMER_SECRET: ${{ secrets.X_CONSUMER_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          SCHEDULED_LIVE: ${{ vars.X_PUBLISHING_ENABLED }}
          REQUESTED_LIVE: ${{ inputs.live }}
        run: |
          if [ "$SCHEDULED_LIVE" = "true" ] || [ "$REQUESTED_LIVE" = "true" ]; then
            python src/x_publish.py publish --live
          else
            python src/x_publish.py publish
          fi
      - name: Commit publication status
        run: |
          if git diff --quiet -- data/x_queue.json; then
            echo "No queue status change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/x_queue.json
          git commit -m "chore(x): record publication status [skip ci]"
          git push
      - name: Report publication failure
        if: steps.publish.outcome == 'failure'
        run: |
          echo "The X API request failed; the error was recorded in data/x_queue.json."
          exit 1
