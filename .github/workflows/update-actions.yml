name: Update pinned actions

on:
  schedule:
    - cron: "0 4 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-pinned-actions
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Update immutable action pins
        run: python scripts/update_actions.py --write

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Commit verified updates
        run: |
          if git diff --quiet -- .github/workflows/; then
            echo "Action pins are current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/
          git commit -m "chore: update pinned GitHub Actions [skip ci]"
          git push
